name: sevika_pro
description: "Professional partner app for service providers to manage bookings, track live locations, and bid on local job requests."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.1

#--------------- PACKAGES ------------------#
dependencies:
  flutter:
    sdk: flutter


  # Adds the core localization delegates
  flutter_localizations:
    sdk: flutter
  # Adds formatting for dates, numbers, and plurals
  intl: any  

  # Utility Packages
  http: 
  logger: 
  url_launcher: 
  flutter_native_splash: 
  smooth_page_indicator: 
  connectivity_plus: 
  lottie: ^3.1.0 # OR RIVE
  shimmer: 
  cached_network_image: 
  flutter_cache_manager:   

  # Icons
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.8

  # State Management
  get: ^4.7.2
  get_storage: ^2.1.1
  shared_preferences:
  flutter_secure_storage: 
  go_router: ^15.1.1
  equatable: ^2.0.7
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  hydrated_bloc: ^11.0.0 
  path_provider: ^2.1.3
  open_filex: ^4.5.0

  # Network 
  dartz:
  dio:
  get_it:

  # Product Specific
  readmore: ^3.0.0
  carousel_slider: ^5.0.0
  flutter_rating_bar: ^4.0.1
  capped_progress_indicator: ^0.0.2
  flutter_svg:
  fan_carousel_image_slider:
  image_picker: ^1.2.2
  dart_pusher_channels: ^1.3.1
  qr_flutter: ^4.1.0
  webview_flutter: ^4.14.1
  google_sign_in: ^6.2.2 
  sign_in_with_apple: ^6.1.1
  flutter_facebook_auth: ^7.0.0 
  geolocator: ^14.0.3
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0
  google_maps_flutter: ^2.18.0
  maplibre_gl: ^0.26.2
  # For real devide
  #agora_rtc_engine: ^6.5.4

  # For simulator
  agora_rtc_engine: 6.3.2
  permission_handler: ^13.0.1
  flutter_callkit_incoming: ^3.1.5
  geocoding: ^5.0.0
  
 


  #--------------- ./ PACKAGES END ------------------#

  

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  mockito: ^5.4.4          # Check for the latest version
  build_runner: ^2.4.8 
  bloc_test: ^10.0.0


  flutter_lints: ^6.0.0


